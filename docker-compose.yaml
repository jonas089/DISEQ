    environment:
      - PATH_TO_DB=/var/data/node-2
      - API_HOST_WITH_PORT=0.0.0.0:8081
      - LOCAL_VALIDATOR=1
      - PROPOSE_TIMEOUT_MS=${PROPOSE_TIMEOUT_MS:-1000}
      - PREVOTE_TIMEOUT_MS=${PREVOTE_TIMEOUT_MS:-1000}
      - PRECOMMIT_TIMEOUT_MS=${PRECOMMIT_TIMEOUT_MS:-1000}
      - TIMEOUT_DELTA_MS=${TIMEOUT_DELTA_MS:-500}
      - REBROADCAST_INTERVAL_MS=${REBROADCAST_INTERVAL_MS:-2000}
      - TICK_INTERVAL_MS=${TICK_INTERVAL_MS:-10}
      - MAX_BLOCK_MESSAGES=${MAX_BLOCK_MESSAGES:-1000000}
      - MAX_PENDING_MESSAGES=${MAX_PENDING_MESSAGES:-200000}
      - MAX_BATCH_MESSAGES=${MAX_BATCH_MESSAGES:-4096}
      - BATCH_INTERVAL_MS=${BATCH_INTERVAL_MS:-20}
    networks:
      - rust-net
    ports:
      - "8081:8081"

  rust-node-3:
    container_name: rust-node-3
