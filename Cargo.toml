[package]
name = "l2-sequencer"
version = "0.1.0"
edition = "2021"

[dependencies]
k256 = "0.13.3"
schnorrkel = "0.11.5"
sha2 = "0.10.8"
libm = "0.2.16"
hex = "0.4"
rand_core = "0.6.4"

ciphercurve-trie = { git = "https://github.com/jonas089/ciphercurve-trie" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
colored = "2.1.0"
tokio = { version = "1.38", features = ["full"] }
anyhow = "1.0"
axum = "0.7.5"
reqwest = { version = "0.12.5", features = ["json"] }
bincode = "1.3.3"
rand = "0.8.5"
rusqlite = "0.32"
viuer = "0.6"
image = "0.24"


[dev-dependencies]
tempfile = "3"

# VRF/curve arithmetic is very slow unoptimized; keep debug builds and tests usable
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.schnorrkel]
opt-level = 3
[profile.dev.package.k256]
opt-level = 3
[profile.dev.package.elliptic-curve]
opt-level = 3

[features]
local-net = []
