[workspace]
resolver = "2"
members = ["consensus", "node"]

[workspace.dependencies]
anyhow = "1.0"
bincode = "1.3.3"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10.8"
k256 = "0.13.3"
rand = "0.8.5"
tempfile = "3"

# VRF/curve arithmetic is very slow unoptimized; keep debug builds and tests usable
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.schnorrkel]
opt-level = 3
[profile.dev.package.k256]
opt-level = 3
[profile.dev.package.elliptic-curve]
opt-level = 3
